server:
  port: 8080

ticketflow:
  security:
    allowed-origins: http://localhost:4200

spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
              filters:
                - AddResponseHeader=X-Served-By, api-gateway
            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/events/**
              filters:
                - AddResponseHeader=X-Served-By, api-gateway
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/**
              filters:
                - AddResponseHeader=X-Served-By, api-gateway

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: health,info,gateway